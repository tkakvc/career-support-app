plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	// spring-ai は正式リリース前の M6（マイルストーン版）のため、
	// 通常の mavenCentral には無く、Spring 専用のマイルストーン用リポジトリが別途必要
	maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// マイグレーション基盤。memo/残作業.md「マイグレーション基盤（Flyway等）」対応
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// ALBのヘルスチェック（/actuator/health）用。これが無いと/actuator/healthは
	// 存在しないURLになり、GlobalExceptionHandlerの catch-all に拾われて500を返してしまう
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// OpenAI API を呼び出すためのライブラリ（AiConfig.java の ChatClient が使う）
	// 【2026-09-XX追記】旧・学習提案機能のキャッシュ（spring-boot-starter-cache・caffeine）は、
	// 参考資料生成への作り替えで廃止した（interest次第で結果が変わるためキャッシュ自体が
	// 成立しない。詳しくはmemo/ai/AIガードレール強化.md）
	implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter:1.0.0-M6'
	// AI参考資料生成の非同期化（SQS）で使う。memo/ai/AI提案の非同期化(SQS).md 参照
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs:3.4.0'
	// OpenAIが生成したMarkdown要約をHTMLに変換する（LLMに直接HTMLを生成させると崩れやすいため）
	implementation 'org.commonmark:commonmark:0.22.0'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// テスト専用のインメモリDB。testRuntimeOnly なので本番・ローカル開発では使われない。
	// テスト実行時にPostgreSQLを別途起動しなくても済むようにするためのもの
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Redis クライアント。リフレッシュトークンを Redis に保存して失効管理するために使う。
	// StringRedisTemplate 等が使えるようになる（本番は ElastiCache、ローカルは redis コンテナ/redis-server に接続）
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// JWT生成・検証ライブラリ（jjwt）
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Swagger UI（/swagger-ui.html）を自動生成するライブラリ。
	// コントローラーのコードから、動くAPI一覧画面を自動で作ってくれる
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

	// 本番の添付ファイル保存先（S3）用クライアント（S3StorageService が使用）
	implementation platform('software.amazon.awssdk:bom:2.29.29')
	implementation 'software.amazon.awssdk:s3'
}

tasks.named('test') {
	useJUnitPlatform()
}
