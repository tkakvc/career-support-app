spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  ai:
    openai:
      api-key: dummy-key-for-tests
  cloud:
    aws:
      region:
        static: ap-northeast-1
      credentials:
        access-key: dummy-access-key-for-tests
        secret-key: dummy-secret-key-for-tests

app:
  jwt:
    secret: test-secret-value-for-unit-tests-do-not-use-in-production
    access-expiration: 900
    refresh-expiration: 1209600
  cors:
    allowed-origins: http://localhost:3000
  cookie:
    secure: false
  websearch:
    api-key: dummy-tavily-key-for-tests
    base-url: https://api.tavily.com
