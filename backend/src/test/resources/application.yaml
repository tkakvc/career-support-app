spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  ai:
    openai:
      api-key: dummy-key-for-tests
  cloud:
    aws:
      region:
        static: ap-northeast-1
      # credentials.access-key/secret-keyにダミー値を固定で書いていたが削除した。
      # これがあると、CIがOIDCで取得した本物の一時認証情報（環境変数AWS_ACCESS_KEY_ID等）を
      # 上書きしてしまい、SQSへの接続が「The security token included in the request is
      # invalid」(403)で失敗する。削除することでデフォルトの認証情報プロバイダチェーン
      # （環境変数→~/.aws/credentials→EC2/ECSのメタデータ、の順で探す仕組み）が使われ、
      # ローカルではaws configureで設定した自分の認証情報、CIではOIDCの一時認証情報が使われる。

app:
  jwt:
    secret: test-secret-value-for-unit-tests-do-not-use-in-production
    access-expiration: 900
    refresh-expiration: 1209600
  cors:
    allowed-origins: http://localhost:3000
  cookie:
    secure: false
  websearch:
    api-key: dummy-tavily-key-for-tests
    base-url: https://api.tavily.com
