spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/career_app
    username: postgres
    password: password

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      # Flyway導入により、スキーマの作成・変更はマイグレーションファイルに一元化した。
      # updateのままだとHibernateも独自にスキーマを変更しようとして二重管理になるため、
      # 「エンティティの定義と実際のスキーマが一致しているかだけ確認する」validateに変更する
      ddl-auto: validate
    show-sql: true

  flyway:
    # 既存のテーブル（ddl-auto: updateで作成済み）をFlyway導入前の状態として扱う。
    # V1__baseline_schema.sqlはその時点の全テーブルをそのままCREATE TABLEした「スナップショット」なので、
    # 既存DBは既にV1の内容を満たしている＝baseline-versionはV1と同じ1にする（0のままだとV1自体が
    # 「まだ適用されていない」scopeに入ってしまい、既存テーブルとCREATE TABLEが衝突してエラーになる。
    # 実際に本番で発生して気づいた）。baseline-on-migrateは「schema_historyが無く、かつ中身が空でない
    # DBにだけ」作用する仕組みなので、CI等の空のDBには影響しない
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
      moderation:
        options:
          model: omni-moderation-latest

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-1}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-expiration: 900
    refresh-expiration: 1209600
  cors:
    allowed-origins: http://localhost:3000
  cookie:
    # リフレッシュトークンCookieのSecure属性。HTTPS環境が前提の本番はtrue。
    # ローカル(http://localhost)はSecure=trueだとブラウザがCookieを送ってくれないため
    # application-local.yamlでfalseに上書きする
    secure: true
  websearch:
    # Tavily（LLM向けのWeb検索API）。参考資料生成（AiService.generateResult）で、
    # OpenAIに要約させる前に実際の検索結果を取得するために使う
    api-key: ${TAVILY_API_KEY:}
    base-url: https://api.tavily.com

storage:
  type: ${STORAGE_TYPE:local}
  local:
    base-path: uploads
  s3:
    bucket-name: ${STORAGE_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-1}

logging:
  level:
    "[org.springframework.ai]": WARN
