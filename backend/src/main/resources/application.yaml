spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/career_app
    username: postgres
    password: password

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-expiration: 900
    refresh-expiration: 1209600
  cors:
    allowed-origins: http://localhost:3000

storage:
  type: ${STORAGE_TYPE:local}
  local:
    base-path: uploads
  s3:
    bucket-name: ${STORAGE_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-1}

logging:
  level:
    "[org.springframework.ai]": WARN
